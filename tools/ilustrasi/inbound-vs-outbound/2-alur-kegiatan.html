<style>
.lane{margin-top:22px}.lane .lb{font:700 16px 'JetBrains Mono';letter-spacing:.12em;margin-bottom:10px}
.flow{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr 26px 1fr;align-items:center;gap:6px}
.st{background:#14203A;border:1px solid #22304B;border-radius:14px;padding:16px 10px;text-align:center;font-weight:800;font-size:22px;line-height:1.15}
.st small{display:block;font:700 14px 'JetBrains Mono';color:#9AA8C0;margin-bottom:6px;letter-spacing:.08em}
.ar{font:800 26px 'Plus Jakarta Sans';text-align:center}
.in .ar,.in .lb{color:#FFC400}.in .st{border-color:rgba(255,196,0,.55)}
.out .ar,.out .lb{color:#7EE2A8}.out .st{border-color:rgba(126,226,168,.5)}

<div class="lane out"><div class="lb">OUTBOUND · BARANG KELUAR</div><div class="flow">
