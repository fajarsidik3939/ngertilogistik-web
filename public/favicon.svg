<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- garis rute melingkar -->
  <circle cx="540" cy="540" r="400" fill="none" stroke="#FFC400" stroke-opacity="0.22" stroke-width="6" stroke-dasharray="4 26" stroke-linecap="round"/>
  <circle cx="540" cy="140" r="16" fill="#FFC400"/>
  <!-- kotak isometrik -->
  <g transform="translate(540 560)">
    <polygon points="0,-250 260,-110 0,30 -260,-110" fill="url(#top)"/>
    <polygon points="-260,-110 0,30 0,320 -260,180" fill="#E5E7EB"/>
    <polygon points="260,-110 0,30 0,320 260,180" fill="#9CA3AF"/>
    <!-- lakban -->
    <polygon points="-70,-212 70,-212 130,-180 -10,-104 -130,-180" fill="#111827" fill-opacity="0.18"/>
    <!-- centang di sisi kiri -->
    <polyline points="-190,120 -140,170 -60,60" fill="none" stroke="#111827" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- garis tepi -->
    <polyline points="-260,-110 0,30 260,-110" fill="none" stroke="#111827" stroke-opacity="0.35" stroke-width="6"/>
    <line x1="0" y1="30" x2="0" y2="320" stroke="#111827" stroke-opacity="0.35" stroke-width="6"/>
  </g>
</svg>
